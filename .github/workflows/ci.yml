# Free on GitHub for public repositories: runs on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: Laravel API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifeflow-api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, intl, zip, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  # Production runs on PostgreSQL (Neon), so run the same tests against a
  # throwaway Postgres too. (phpunit.xml's SQLite settings yield to these.)
  api-postgres:
    name: Laravel API tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lifeflow
          POSTGRES_PASSWORD: lifeflow
          POSTGRES_DB: lifeflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: lifeflow_test
      DB_USERNAME: lifeflow
      DB_PASSWORD: lifeflow
    defaults:
      run:
        working-directory: lifeflow-api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, intl, zip, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  app:
    name: Flutter analyze, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifeflow_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release
