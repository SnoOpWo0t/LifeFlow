# Builds the installable Android app (APK) on GitHub's machines, so nothing
# Android-related has to be installed locally.
#
# Run it: GitHub → Actions → "Android APK" → Run workflow. Optionally give the
# API address (e.g. https://lifeflow-api.onrender.com/api/v1); without one, set
# the server from the app's sign-in screen. Download the APK from the run's
# "Artifacts". Pushing a tag like v1.0.0 also publishes it as a GitHub Release,
# and https://github.com/<owner>/<repo>/releases/latest/download/LifeFlow.apk
# then always downloads the newest one.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API base URL baked into the app (optional), e.g. https://your-api.onrender.com/api/v1'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the APK to a release on tag pushes
    defaults:
      run:
        working-directory: lifeflow_app
    env:
      # The run's input wins, then the repository variable API_BASE_URL
      # (Settings → Secrets and variables → Actions → Variables), then the
      # live API on Render.
      API_URL: ${{ inputs.api_url || vars.API_BASE_URL || 'https://lifeflow-api-06bt.onrender.com/api/v1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # Optional: sign with your own key. Add the secrets ANDROID_KEYSTORE_BASE64
      # (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
      # ANDROID_KEY_PASSWORD. Without them the APK is signed with a debug key,
      # which installs fine but can't go on the Play Store.
      - name: Set up release signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "No keystore secret: using the debug key."; exit 0; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build
        run: |
          define=""
          if [ -n "$API_URL" ]; then define="--dart-define=API_BASE_URL=$API_URL"; fi
          flutter build apk --release $define
          flutter build apk --release --split-per-abi $define
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/LifeFlow-$version.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/LifeFlow-$version-arm64.apk"
          # Fixed name for the README's "latest" download link.
          cp build/app/outputs/flutter-apk/app-release.apk dist/LifeFlow.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: LifeFlow-android
          path: lifeflow_app/dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: lifeflow_app/dist/*.apk
          generate_release_notes: true
